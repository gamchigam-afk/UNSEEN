function investigate(l){

let a=loc[l];

let f=found();

let id=a.find(
x=>!f.includes(x)
);

if(!id){

cutOpen(
"주변을 자세히 살펴봤지만, 특별한 것은 발견되지 않았다.",
null
);

return;

}

let d=E[id];

cutOpen(d[2],id);

}


function cutOpen(text,id){

document.getElementById("cut")
.classList.remove("hidden");

document.getElementById("cutText")
.style.display="grid";

document.getElementById("cutText")
.textContent=text;

document.getElementById("reveal")
.style.display="none";

if(id){

setTimeout(()=>{

document.getElementById("cutText")
.style.display="none";

document.getElementById("reveal")
.style.display="block";

document.getElementById("revealTitle")
.textContent=
`증거물 ${String(id).padStart(2,"0")} — ${E[id][0]}`;

let f=found();

if(!f.includes(id)){
f.push(id);
}

setFound(f);

},1500);

}else{

setTimeout(
closeCut,
1500
);

}

}


function closeCut(){

document.getElementById("cut")
.classList.add("hidden");

document.getElementById("reveal")
.style.display="none";

document.getElementById("cutText")
.style.display="grid";

updateCurrent();

}

"overview";

evidence();

}else if(id==="train"){

train();

}else{

}

function submitDeduction(){

document.getElementById("proof").value;

if(!suspect || !route || !proof){

alert(
"모든 항목을 선택해야 합니다."
);

return;

B가 알렉스를 데려갔다.
객차 연결부를 이용했다.

let correctSuspect=
suspect==="b";

let correctRoute=
route==="connection";

let correctProof=
proof==="24";

document.getElementById("finalResult");

correctRoute &&

<span class="muted">

</span>

</div>

</div>

`;

}else{

reason+="지목한 인물이 사건의 실제 책임자와 일치하지 않는다.<br>";

}

if(!correctRoute){

reason+="알렉스의 이동 경로에 대한 판단이 정확하지 않다.<br>";

}

if(!correctProof){

reason+="선택한 증거는 사건을 결정적으로 설명하기에 부족하다.<br>";

}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UNSEEN</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080909;
    color:#e8e5dc;
    font-family:Georgia,"Times New Roman",serif;
}

button{
    cursor:pointer;
    font:inherit;
}

.hidden{
    display:none!important;
}

.screen{
    width:100vw;
    min-height:100vh;
    position:relative;
    background:
        radial-gradient(
            ellipse at center,
            #252522 0%,
            #111210 45%,
            #070807 100%
        );
}

.screen::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.015) 0px,
            rgba(255,255,255,.015) 1px,
            transparent 1px,
            transparent 4px
        );
    pointer-events:none;
}

/* =========================
   장식
========================= */

.corner{
    position:absolute;
    width:35px;
    height:35px;
    border-color:#45443f;
    border-style:solid;
    opacity:.6;
}

.tl{
    top:25px;
    left:25px;
    border-width:1px 0 0 1px;
}

.tr{
    top:25px;
    right:25px;
    border-width:1px 1px 0 0;
}

.bl{
    bottom:25px;
    left:25px;
    border-width:0 0 1px 1px;
}

.br{
    bottom:25px;
    right:25px;
    border-width:0 1px 1px 0;
}

/* =========================
   메인
========================= */

#mainScreen{
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.main-container{
    position:relative;
    width:min(650px,90%);
    text-align:center;
}

.case-label{
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:6px;
    color:#77766f;
    margin-bottom:35px;
}

.title{
    font-size:clamp(65px,12vw,125px);
    letter-spacing:18px;
    font-weight:normal;
    margin:0;
    text-shadow:0 0 20px rgba(255,255,255,.08);
}

.line{
    width:230px;
    height:1px;
    background:#68665e;
    margin:28px auto;
}

.subtitle{
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:5px;
    color:#88877f;
}

.menu{
    width:240px;
    margin:10px auto;
    padding:13px 20px;
    background:transparent;
    border:1px solid #4d4c47;
    color:#d8d5cc;
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:3px;
    transition:.25s;
}

.menu:hover{
    background:#e5e1d7;
    color:#111;
    border-color:#e5e1d7;
}

.version{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    color:#4f4e49;
}

/* =========================
   챕터 선택
========================= */

#chapterScreen{
    display:none;
    justify-content:center;
    align-items:center;
}

.chapter-container{
    width:min(700px,90%);
    text-align:center;
}

.chapter-title{
    font-size:38px;
    letter-spacing:8px;
    font-weight:normal;
    margin-bottom:10px;
}

.chapter-subtitle{
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:4px;
    color:#77766f;
    margin-bottom:45px;
}

.chapter-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
}

.chapter-button{
    width:min(500px,100%);
    padding:20px;
    background:#111416;
    border:1px solid #41413d;
    color:#ddd9cf;
    text-align:left;
    transition:.25s;
}

.chapter-button:hover{
    background:#e5e1d7;
    color:#111;
    border-color:#e5e1d7;
}

.chapter-number{
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    color:#77766f;
}

.chapter-name{
    margin-top:8px;
    font-size:19px;
    letter-spacing:3px;
}

.locked{
    opacity:.35;
}

.locked:hover{
    background:#111416;
    color:#ddd9cf;
    border-color:#41413d;
}

.back{
    margin-top:30px;
    background:transparent;
    border:0;
    color:#77766f;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:3px;
}

.back:hover{
    color:#fff;
}

/* =========================
   업적
========================= */

#achievementScreen{
    display:none;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
}

.achievement-container{
    width:min(850px,100%);
}

.achievement-title{
    text-align:center;
    font-size:40px;
    letter-spacing:8px;
    margin-bottom:10px;
}

.achievement-subtitle{
    text-align:center;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:4px;
    color:#777;
    margin-bottom:30px;
}

.tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:25px;
}

.tab{
    padding:10px 25px;
    background:transparent;
    border:1px solid #444;
    color:#888;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:2px;
}

.tab.active,
.tab:hover{
    background:#e5e1d7;
    color:#111;
}

.achievement-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.achievement{
    border:1px solid #383a3b;
    background:#111416;
    padding:18px;
    min-height:105px;
}

.achievement.unlocked{
    border-color:#777;
}

.achievement.locked-ach{
    opacity:.4;
}

.achievement-icon{
    font-size:23px;
    float:left;
    margin-right:13px;
}

.achievement-name{
    font-size:16px;
    letter-spacing:1px;
    margin-bottom:7px;
}

.achievement-desc{
    font-size:11px;
    color:#777;
    line-height:1.7;
}

.achievement-status{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:2px;
    color:#666;
    margin-top:8px;
}

.achievement-count{
    text-align:center;
    color:#777;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:20px;
}

/* =========================
   게임
========================= */

#gameScreen{
    display:none;
    min-height:100vh;
    background:#090b0d;
}

.top{
    height:60px;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#0d0f11;
}

.logo{
    letter-spacing:3px;
    font-size:13px;
}

.muted{
    color:#777;
}

.layout{
    display:flex;
    min-height:calc(100vh - 60px);
}

aside{
    width:200px;
    border-right:1px solid #333;
    padding:12px;
    background:#0d0f11;
}

.menu-side{
    width:100%;
    padding:13px 10px;
    text-align:left;
    background:transparent;
    color:#888;
    border:0;
    border-bottom:1px solid #222;
}

.menu-side:hover,
.menu-side.active{
    background:#191c1f;
    color:#fff;
}

main{
    width:min(1100px,100%);
    padding:34px;
}

h2{
    letter-spacing:3px;
}

.subtitle2{
    color:#666;
    font-size:12px;
    margin:8px 0 25px;
}

.panel,
.card{
    border:1px solid #333;
    background:#111416;
    padding:22px;
    margin-bottom:15px;
}

.card{
    cursor:pointer;
}

.card:hover{
    border-color:#666;
    background:#171a1c;
}

.label{
    font-size:10px;
    letter-spacing:2px;
    color:#666;
    margin-bottom:9px;
}

.text{
    line-height:1.9;
    color:#aaa;
    font-size:13px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.name{
    font-size:17px;
    margin:7px 0;
}

.small{
    font-size:11px;
    color:#666;
}

/* =========================
   진행도
========================= */

.progress{
    margin-top:18px;
}

.bar{
    height:6px;
    background:#25282a;
}

.fill{
    height:100%;
    background:#ddd;
}

/* =========================
   증거
========================= */

.evidence{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.detail{
    padding:9px 14px;
    border:1px solid #444;
    background:transparent;
    color:#aaa;
}

.detail:hover{
    background:#eee;
    color:#111;
}

.empty{
    text-align:center;
    padding:45px;
    color:#666;
    border:1px solid #333;
    background:#111416;
    line-height:2;
}

.fakeimg{
    height:270px;
    border:1px solid #333;
    display:grid;
    place-items:center;
    color:#555;
    margin-bottom:22px;
}

/* =========================
   노트
========================= */

textarea{
    width:100%;
    background:#0c0e10;
    color:#ddd;
    border:1px solid #444;
    padding:16px;
    resize:vertical;
    font-family:inherit;
    outline:0;
}

.notes{
    height:420px;
}

.personnote{
    height:160px;
}

/* =========================
   질문
========================= */

.question{
    width:100%;
    text-align:left;
    background:#0d0f11;
    color:#aaa;
    border:1px solid #3b3e40;
    padding:12px;
    margin:5px 0;
}

.question:hover{
    color:#fff;
    border-color:#777;
}

.question.locked{
    opacity:.4;
    cursor:not-allowed;
}

.answer{
    border:1px solid #444;
    padding:18px;
    margin-top:12px;
    color:#bbb;
    line-height:1.8;
}

/* =========================
   조사 컷신
========================= */

.cut{
    position:fixed;
    inset:0;
    background:#000;
    display:grid;
    place-items:center;
    z-index:20;
    padding:25px;
}

.cutin{
    width:min(650px,100%);
    text-align:center;
}

.cuttext{
    font-size:18px;
    line-height:2;
    min-height:100px;
}

.reveal{
    display:none;
}

/* =========================
   최종 추리
========================= */

.finalbox{
    border:1px solid #555;
    padding:25px;
    background:#111416;
    margin-bottom:18px;
}

.select{
    width:100%;
    padding:13px;
    background:#0d0f11;
    color:#ddd;
    border:1px solid #444;
    margin-top:8px;
}

.result{
    padding:25px;
    border:1px solid #555;
    line-height:2;
    background:#111416;
    margin-top:20px;
}

/* =========================
   업적 팝업
========================= */

#achievementPopup{
    position:fixed;
    right:25px;
    bottom:25px;
    width:310px;
    background:#111416;
    border:1px solid #777;
    padding:17px;
    z-index:50;
    display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.popup-small{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:#888;
}

.popup-name{
    margin-top:8px;
    font-size:17px;
}

.popup-desc{
    margin-top:6px;
    color:#777;
    font-size:11px;
}

/* =========================
   모바일
========================= */

@media(max-width:700px){

    .layout{
        display:block;
    }

    aside{
        width:100%;
        display:flex;
        overflow:auto;
    }

    .menu-side{
        min-width:105px;
        text-align:center;
        border:0;
    }

    main{
        padding:22px 15px;
    }

    .grid,
    .achievement-grid{
        grid-template-columns:1fr;
    }

    .evidence{
        display:block;
    }

    .detail{
        margin-top:12px;
    }

}
</style>
</head>

<body>

<!-- =========================
     메인 화면
========================= -->

<div id="mainScreen" class="screen">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="main-container">

        <div class="case-label">
            CASE DATABASE // 1998
        </div>

        <h1 class="title">
            UNSEEN
        </h1>

        <div class="line"></div>

        <div class="subtitle">

        </div>

        <div style="margin-top:60px;">

            <button
                class="menu"
                onclick="openChapters()">
                GAME START
            </button>

            <button
                class="menu"
                onclick="openAchievements()">
                ACHIEVEMENTS
            </button>

            <button
                class="menu"
                onclick="caseRecords()">
                CASE RECORDS
            </button>

            <button
                class="menu"
                onclick="settings()">

            </button>

        </div>

    </div>

    <div class="version">

    </div>

</div>


<!-- =========================

<div id="chapterScreen" class="screen">

                    CHAPTER 03
                </div>

                <div class="chapter-name">
                    ???　🔒
                </div>

            </button>

        </div>

        <button
            class="back"
            onclick="backToMain()">
            ← BACK
        </button>

    </div>

</div>


<!-- =========================
     업적 화면
========================= -->

<div id="achievementScreen" class="screen">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="achievement-container">

        <div class="achievement-title">
            ACHIEVEMENTS
        </div>

        <div class="achievement-subtitle">
            RECORD OF INVESTIGATION
        </div>

        <div class="achievement-count" id="achievementCount">
            0 / 0 UNLOCKED
        </div>

        <div class="tabs">

            <button
                id="tabChapter1"

            </button>

            <button
                id="tabAll"
                class="tab"
                onclick="achievementTab('all')">
                ALL
            </button>

        </div>

        <div
            id="achievementList"
            class="achievement-grid">
        </div>

        <div style="text-align:center">

            <button
                class="back"
                onclick="closeAchievements()">
                ← BACK
            </button>

        </div>

    </div>

</div>


<!-- =========================
     게임 화면
========================= -->

<div id="gameScreen">

<header class="top">

    <div class="logo">
        UNSEEN
    </div>

    <div class="muted">
        CHAPTER 01 // 23:17
    </div>

</header>


<div class="layout">

<aside>

    <button
        id="mOverview"
        class="menu-side"
        onclick="overview()">
        📁 사건 개요
    </button>

    <button
        id="mPeople"
        class="menu-side"
        onclick="people()">
        👤 인물
    </button>

    <button
        id="mEvidence"
        class="menu-side"
        onclick="evidence()">
        📷 증거물
    </button>

    <button
        id="mTrain"
        class="menu-side"
        onclick="train()">
        🚆 열차
    </button>

    <button
        id="mNotes"
        class="menu-side"
        onclick="notes()">
        🧠 추리 노트
    </button>

    <button
        id="mFinal"
        class="menu-side"
        onclick="finalDeduction()">
        ⚖ 최종 추리
    </button>

</aside>

<main id="main"></main>

</div>
</div>


<!-- =========================
     조사 컷신
========================= -->

<div
    id="cut"
    class="cut hidden">

    <div class="cutin">

        <div
            id="cutText"
            class="cuttext">
        </div>

        <div
            id="reveal"
            class="reveal">

            <div class="fakeimg">
                [이미지 준비중]
            </div>

            <div class="muted">
                새로운 증거물
            </div>

            <h3 id="revealTitle"></h3>

            <button
                class="menu"
                onclick="closeCut()">
                확인
            </button>

        </div>

    </div>

</div>


<!-- =========================
     업적 획득 팝업
========================= -->

<div id="achievementPopup">

    <div class="popup-small">
        ACHIEVEMENT UNLOCKED
    </div>

    <div
        id="popupName"
        class="popup-name">
    </div>

    <div
        id="popupDesc"
        class="popup-desc">
    </div>

</div>

/* =====================================================

===================================================== */

const CURRENT_CHAPTER="1";

function key(name){
    return "chapter"+CURRENT_CHAPTER+"_"+name;
}

function getJSON(name,defaultValue){

    try{

        return JSON.parse(
            localStorage.getItem(key(name))
        ) ?? defaultValue;

    }catch{

        return defaultValue;

    }

}

function setJSON(name,value){

    localStorage.setItem(
        key(name),
        JSON.stringify(value)
    );

}

function getFound(){

    return getJSON("evidence",[]);

}

function setFound(value){

    setJSON("evidence",value);

}

function unlockedAchievements(){

    return JSON.parse(
        localStorage.getItem("unseen_achievements") || "[]"
    );

}

function saveAchievements(arr){

    localStorage.setItem(
        "unseen_achievements",
        JSON.stringify(arr)
    );

}

function unlockAchievement(id){

    let unlocked=unlockedAchievements();

    if(unlocked.includes(id)) return;

    unlocked.push(id);

    saveAchievements(unlocked);

    let ach=ACHIEVEMENTS.find(
        a=>a.id===id
    );

    if(ach){

        showAchievementPopup(ach);

    }

    checkMetaAchievements();

}

function hasAchievement(id){

    return unlockedAchievements()
        .includes(id);

}

let popupTimer=null;

function showAchievementPopup(ach){

    let popup=
        document.getElementById("achievementPopup");

    document.getElementById("popupName")
        .textContent="🏆 "+ach.name;

    document.getElementById("popupDesc")
        .textContent=ach.desc;

    popup.style.display="block";

    clearTimeout(popupTimer);

    popupTimer=setTimeout(()=>{

        popup.style.display="none";

    },3500);

}


/* =====================================================
   메타 업적
===================================================== */

function checkMetaAchievements(){

    let chapterAchievements=
        ACHIEVEMENTS.filter(
            a=>a.chapter==="1"
        );

    let unlockedChapter=
        chapterAchievements.filter(
            a=>hasAchievement(a.id)
        ).length;

    if(unlockedChapter>=5){

        unlockAchievement("archivist");

    }

}

===================================================== */

function cutOpen(text,id){

    document.getElementById("cut")
        .classList.remove("hidden");

    document.getElementById("cutText")
        .style.display="grid";

    document.getElementById("cutText")
        .textContent=text;

    document.getElementById("reveal")
        .style.display="none";


    if(id){

        setTimeout(()=>{

            document.getElementById("cutText")
                .style.display="none";

            document.getElementById("reveal")
                .style.display="block";

            document.getElementById("revealTitle")
                .textContent=
                `증거물 ${String(id).padStart(2,"0")} — ${E[id][0]}`;


            let f=getFound();

            if(!f.includes(id)){

                f.push(id);

                setFound(f);

                unlockEvidenceAchievement(id);

            }

        },1500);

    }else{

        setTimeout(
            closeCut,
            1500
        );

    }

}


function unlockEvidenceAchievement(id){

    let f=getFound();

    if(f.length===1){

        unlockAchievement(
            "first_evidence"
        );

    }

    if(f.length>=24){

        unlockAchievement(
            "all_evidence"
        );

    }

    if(id===4){

        unlockAchievement(
            "clock"
        );

    }

    if(id>=1 && id<=8){

        if(!hasAchievement("empty_seat")){

            unlockAchievement(
                "empty_seat"
            );

        }

    }

    if(id>=22){

        unlockAchievement(
            "opposite"
        );

    }

    checkAllPlaces();

}


function checkAllPlaces(){

    let f=getFound();

    let allPlaces=
        Object.values(loc).every(
            arr=>arr.some(
                id=>f.includes(id)
            )
        );

    if(allPlaces){

        unlockAchievement(
            "all_places"
        );

    }

}


function closeCut(){

    document.getElementById("cut")
        .classList.add("hidden");

    document.getElementById("reveal")
        .style.display="none";

    document.getElementById("cutText")
        .style.display="grid";

    updateCurrent();

}

function resetChapter(chapter){

    let ok=confirm(

        "CHAPTER "+String(chapter).padStart(2,"0")+
        "의 진행 데이터를 모두 초기화할까요?\n\n"+
        "증거물, 추리 노트, 인물별 메모,\n"+
        "질문 기록, 진행도만 삭제됩니다.\n\n"+
        "업적은 삭제되지 않습니다."

    );

    if(!ok) return;


    /*
        챕터별 데이터만 삭제.

        나중에 CHAPTER 02를 만들면
        resetChapter(2)를 사용하면 됨.
    */

    const prefix=
        "chapter"+chapter+"_";


    const chapterKeys=[

        "evidence",
        "notes",
        "person_notes",
        "answered_questions",
        "viewed_people"

    ];


    chapterKeys.forEach(name=>{

        localStorage.removeItem(
            prefix+name
        );

    });


    /*
        업적은 일부러 삭제하지 않음.
        따라서 '처음부터 다시'도
        업적 기록을 유지할 수 있음.
    */

    unlockAchievement("reset");


    alert(
        "CHAPTER "+
        String(chapter).padStart(2,"0")+
        "의 진행 데이터가 초기화되었습니다."
    );


    location.reload();

}

        suspect==="b";

        route==="connection";

    let correctProof=
        proof==="24";


    unlockAchievement(
        "complete_investigation"
    );

        correctProof
    ){

        unlockAchievement(
            "true_end"
        );

        unlockAchievement(
            "unseen"
        );


        result.innerHTML=`

        <div class="result">

            <h2>
                TRUE END
            </h2>

            <div class="text">

                당신은 사건의 핵심을 정확하게 짚어냈다.<br><br>

                알렉스는 스스로 사라진 것이 아니었다.
                누군가의 도움을 받아 7호차에서 이동했고,
                그 과정에서 객차 연결부를 이용했다.<br><br>

                지금까지 발견된 시간 기록과 이동 흔적,
                그리고 인물들의 진술을 종합하면
                하나의 결론에 도달할 수 있다.

                <br><br>

                <span class="muted">
                    CASE 01 — SOLVED
                </span>

            </div>

        </div>

        `;

    }else{

        unlockAchievement(
            "bad_end"
        );


        let reason="";


        if(!correctSuspect){

            reason+=
            "지목한 인물이 사건의 실제 책임자와 일치하지 않는다.<br>";

        }


        if(!correctRoute){

            reason+=
            "알렉스의 이동 경로에 대한 판단이 정확하지 않다.<br>";

        }


        if(!correctProof){

            reason+=
            "선택한 증거는 사건을 결정적으로 설명하기에 부족하다.<br>";

        }


        result.innerHTML=`

        <div class="result">

            <h2>
                BAD END
            </h2>

            <div class="text">

                당신의 추리는 사건의 전체 흐름을
                설명하지 못했다.<br><br>

                ${reason}

                <br>

                일부 단서는 맞았을 수도 있지만,
                결정적인 부분에서 판단이 어긋났다.

                <br><br>

                <span class="muted">
                    CASE 01 — UNSOLVED
                </span>

            </div>

        </div>

        `;

    }

}


/* =====================================================
   자동 저장
===================================================== */

document.addEventListener(
    "input",
    e=>{

        if(e.target.id==="notes"){

            localStorage.setItem(
                key("notes"),
                e.target.value
            );


            unlockAchievement(
                "first_note"
            );


            let n=
                document.getElementById(
                    "ns"
                );

            if(n){

                n.textContent="저장됨";

            }

        }


        if(e.target.id==="pn"){

            savePersonNote();

        }

    }
);


/* =====================================================
   메뉴 활성화
===================================================== */

function showMenu(id){

    [
        "mOverview",
        "mPeople",
        "mEvidence",
        "mTrain",
        "mNotes",
        "mFinal"
    ].forEach(x=>{

        document
            .getElementById(x)
            .classList.remove("active");

    });


    document
        .getElementById(id)
        .classList.add("active");

}


/* =====================================================
   ESC로 컷신 닫기
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Escape"){

            let cut=
                document.getElementById(
                    "cut"
                );

            if(!cut.classList.contains("hidden")){

                closeCut();

            }

        }

    }
);


/* =====================================================
   시작 상태
===================================================== */

document.getElementById(
    "mainScreen"
).style.display="flex";

document.getElementById(
    "chapterScreen"
).style.display="none";

document.getElementById(
    "achievementScreen"
).style.display="none";

document.getElementById(
    "gameScreen"
).style.display="none";

</script>

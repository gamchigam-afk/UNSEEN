function show(id){

.forEach(x=>x.classList.add("hidden"));

.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

["mOverview","mPeople","mEvidence","mTrain","mNotes"]
.forEach(x=>
document.getElementById(x).classList.remove("active")
);

document.getElementById(id).classList.add("active");
}

function questionHTML(q,id,i){

let ok=
q[2]===0 ||
found().includes(q[2]);

return `

<button
class="question ${ok?"":"locked"}"
${ok
?`onclick="answer('${id}',${i})"`
:"disabled"}>

${ok
?q[0]
:"🔒 "+q[0]+" — 관련 증거 필요"}

</button>

`;

}

function investigate(l){

let a=loc[l];

let f=found();

let id=a.find(
x=>!f.includes(x)
);

if(!id){

cutOpen(
"주변을 자세히 살펴봤지만, 특별한 것은 발견되지 않았다.",
null
);

return;
}

let d=E[id];

cutOpen(d[2],id);

}

function cutOpen(text,id){

document.getElementById("cut")
.classList.remove("hidden");

document.getElementById("cutText")
.style.display="grid";

document.getElementById("cutText")
.textContent=text;

document.getElementById("reveal")
.style.display="none";

if(id){

setTimeout(()=>{

document.getElementById("cutText")
.style.display="none";

document.getElementById("reveal")
.style.display="block";

document.getElementById("revealTitle")
.textContent=
`증거물 ${String(id).padStart(2,"0")} — ${E[id][0]}`;

let f=found();

if(!f.includes(id)){
f.push(id);
}

setFound(f);

},1500);

}else{

setTimeout(
closeCut,
1500
);

}

}

function closeCut(){

document.getElementById("cut")
.classList.add("hidden");

document.getElementById("reveal")
.style.display="none";

document.getElementById("cutText")
.style.display="grid";

updateCurrent();

}

function updateCurrent(){

let id=

document.getElementById("mEvidence")
.classList.contains("active")

?"evidence"

:

document.getElementById("mTrain")
.classList.contains("active")

?"train"

:

"overview";

if(id==="evidence"){

evidence();

}else if(id==="train"){

train();

}else{

overview();

}

}

function clearNotes(){

if(confirm(
"추리 노트를 전부 삭제할까요?"
)){

localStorage.removeItem(
"case01_notes"
);

notes();

}

}

function resetCase(){

if(confirm(
"획득한 증거, 추리 노트, 인물별 메모를 모두 초기화할까요?"
)){

localStorage.removeItem(
"case01_evidence"
);

localStorage.removeItem(
"case01_notes"
);

localStorage.removeItem(
"case01_person_notes"
);

location.reload();

}

}
